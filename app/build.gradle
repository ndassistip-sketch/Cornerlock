plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sage.cornerlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sage.cornerlock'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // Fixed key so new builds install as updates over old ones.
    signingConfigs {
        debug {
            storeFile file('cornerlock.keystore')
            storePassword 'cornerlock'
            keyAlias 'cornerlock'
            keyPassword 'cornerlock'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
